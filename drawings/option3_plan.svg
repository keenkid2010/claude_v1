<text x="0" y="10" class="t1">Option 3 (Final draft) – IBC tote at rear door, purifier along driver side, generator room at cab end</text>
<text x="0" y="32" class="t2">Plan view, cab to the right, mm. Box 4100 × 2400 (161 × 94.5 in). Dashed = drip trays (≥ 2 in rim, 1 in drain). Yellow = walkway: main 1090 (42.9 in), rear 660 (26.0 in).</text>
<text x="0" y="50" class="t2">IBC swapped by forklift through full-width rear door. Purifier casters removed, bolted to channel base; 304 SS piping DN32 run under floor to 3 curb-side ports.</text>
<text x="0" y="68" class="t2">Generator: louvered doors both ends, 280 service gap + fire-rated access doors in partition, remote oil drain / filters (confirm with genset maker). Roof exhaust per genset manual 3.3.</text>
<text x="0" y="86" class="t2">CG (est., incl. rack ~200 kg + full diesel ~200 kg): 1888 from rear wall, 114 toward driver side. Purifier load ~16 kW – verify genset kW rating. Preliminary – not for fabrication.</text>
</g>
