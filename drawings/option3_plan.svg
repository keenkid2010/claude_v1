<text x="0" y="10" class="t1">Oil Filtration Truck – Final Layout: IBC at rear door, purifier (operation side to aisle), generator room at cab end</text>
<text x="0" y="32" class="t2">Plan view, cab to the right, mm. Box 4100 × 2400 (161 × 94.5 in). Dashed = drip trays (≥ 2 in rim, 1 in drain). Yellow = walkway: main 890 (35.0 in), rear 660 (26.0 in).</text>
<text x="0" y="50" class="t2">Purifier rotated 90° (1100 operation face to aisle), casters removed, bolted to channel base, lifting lugs cut after install. Vacuum pump exhaust piped outside.</text>
<text x="0" y="68" class="t2">Elec. panel and oil connection box both on driver side, exterior access. Generator: louvered doors both ends, 400 service gap + fire-rated partition doors.</text>
<text x="0" y="86" class="t2">CG (est., incl. rack ~200 kg + full diesel ~200 kg): 1865 from rear wall, 91 toward driver side. Genset 66 kW (purifier ~16 kW). Preliminary – not for fabrication.</text>
</g>
